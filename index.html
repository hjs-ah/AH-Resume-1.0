<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antone Holmes — Portfolio</title>
<meta name="description" content="Antone Holmes — sales and GTM leader, educator, builder.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<script>
  /* Apply saved theme before paint to avoid a flash. Default is light. */
  try {
    var t = localStorage.getItem('theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
  /* Colour preview: add ?accent=burnt to the URL (blue is the default). */
  try { var a = new URLSearchParams(location.search).get('accent'); if (a === 'burnt') document.documentElement.setAttribute('data-accent', a); } catch (e) {}
  /* Desktop intro animation: profile starts centred, then slides left. */
  if (window.matchMedia('(min-width: 861px)').matches && !window.matchMedia('(prefers-reduced-motion: reduce)').matches)
    document.documentElement.classList.add('intro');
</script>
</head>
<body>
<a class="skip-link" href="#panel">Skip to content</a>

<div id="loader" class="loader" role="status">Loading…</div>

<div class="app">

  <!-- ══ PROFILE CARD ══════════════════════════════════════ -->
  <div class="profile-col">
  <aside class="profile" aria-label="Profile">
    <div class="profile-head">
      <div class="avatar" id="profile-photo" aria-hidden="true"></div>
      <h1 class="profile-name" id="profile-name">Antone Holmes</h1>
      <p class="profile-sub" id="profile-sub"></p>
    </div>
    <hr class="dots">
    <div class="profile-body">
      <p class="profile-blurb" id="profile-blurb"></p>
      <ul class="socials" id="socials" aria-label="Social links"></ul>
    </div>
    <div class="profile-actions">
      <a class="pa-btn" id="btn-download" href="#cv">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8zM14 3v5h5M9 13h6M9 17h6"/></svg>
        <span>View CV</span>
      </a>
      <a class="pa-btn" id="btn-contact" href="mailto:antoneholmes@icloud.com">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v14H3zM3 7l9 6 9-6"/></svg>
        <span>Contact Me</span>
      </a>
    </div>
  </aside>
  <div class="logo-tab" aria-hidden="true"><img src="/assets/logo.png" alt=""></div>
  <p class="crafted">Crafted by Antone Holmes</p>
  </div>

  <!-- ══ CONTENT CARD (tabs on top) ════════════════════════ -->
  <div class="content-card">
    <nav class="tabs" aria-label="Sections">
      <div class="tabs-brand">
        <span class="tabs-brand-name" id="brand-name">Antone Holmes</span>
        <span class="tabs-brand-sub" id="brand-sub"></span>
      </div>
      <div class="tabs-list" id="tabs-list" role="tablist"></div>
      <button type="button" class="theme-btn" id="theme-btn" aria-label="Switch to dark theme">
        <svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
        <svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span class="theme-btn-label" id="theme-label">Dark</span>
      </button>
    </nav>

    <main class="panel" id="panel" role="tabpanel" tabindex="-1" aria-live="polite">
    </main>
  </div>

</div>

<dialog id="reader" class="reader" aria-labelledby="reader-title">
  <form method="dialog" class="reader-close-form">
    <button class="reader-close" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </form>
  <div class="reader-meta"><span class="reader-date" id="reader-date"></span><span class="chip chip-static" id="reader-tag"></span></div>
  <h2 class="reader-title" id="reader-title"></h2>
  <div class="reader-body" id="reader-body"></div>
</dialog>

<script src="/assets/app.js" defer></script>
</body>
</html>
